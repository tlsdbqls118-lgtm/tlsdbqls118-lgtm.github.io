<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방송 질문 화면</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    #questionBox {
      display: none;
      position: absolute;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%);

      width: 80%;
      max-width: 1000px;
      box-sizing: border-box;

      padding: 28px 36px;

      background: rgba(0, 0, 0, 0.82);
      color: white;

      border-radius: 22px;

      text-align: center;

      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    #label {
      display: block;
      margin-bottom: 10px;

      font-size: 20px;
      font-weight: 600;

      opacity: 0.7;
    }

    #counter {
      display: block;
      margin-bottom: 12px;

      font-size: 16px;
      font-weight: 500;

      opacity: 0.55;
    }

    #questionText {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.45;

      word-break: keep-all;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }

    /*
      마우스를 화면 위쪽으로 가져가면
      조작 버튼 표시
    */

    #controls {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      gap: 8px;

      opacity: 0;
      transition: opacity 0.2s;

      background: rgba(0,0,0,0.65);
      padding: 10px;
      border-radius: 12px;
    }

    body:hover #controls {
      opacity: 1;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;

      cursor: pointer;

      background: #222;
      color: white;

      font-size: 14px;
      font-weight: bold;
    }

    button:hover {
      background: #444;
    }

    #hideBtn {
      background: #777;
    }

    #controlCounter {
      color: white;
      display: flex;
      align-items: center;

      padding: 0 10px;

      font-weight: bold;
      min-width: 70px;
      justify-content: center;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>

<body>


<!-- 조작 버튼 -->

<div id="controls">

  <button id="prevBtn">
    ◀ 이전
  </button>

  <div id="controlCounter">
    0 / 0
  </div>

  <button id="nextBtn">
    다음 ▶
  </button>

  <button id="hideBtn">
    숨기기
  </button>

</div>


<!-- 실제 방송 질문 -->

<div id="questionBox">

  <span id="label">
    익명 질문
  </span>

  <span id="counter"></span>

  <div id="questionText"></div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDq1lPYv5OWP0rdsJCbMh3Xt_laZKEptVQ",

  authDomain:
    "anonymous-question-47aaf.firebaseapp.com",

  projectId:
    "anonymous-question-47aaf",

  storageBucket:
    "anonymous-question-47aaf.firebasestorage.app",

  messagingSenderId:
    "156669665259",

  appId:
    "1:156669665259:web:188f4f90005abacb22c3ae"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* ==============================
   HTML 요소
============================== */

const questionBox =
  document.getElementById("questionBox");

const questionText =
  document.getElementById("questionText");

const counter =
  document.getElementById("counter");

const controlCounter =
  document.getElementById("controlCounter");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const hideBtn =
  document.getElementById("hideBtn");


/* ==============================
   상태
============================== */

let questions = [];

let currentIndex = 0;

let currentQuestionId = null;

let visible = true;


/* ==============================
   질문 목록 실시간 불러오기
============================== */

const questionsQuery = query(

  collection(
    db,
    "questions"
  ),

  orderBy(
    "createdAt",
    "asc"
  )

);


onSnapshot(

  questionsQuery,

  (snapshot) => {

    const previousId =
      currentQuestionId;


    questions =
      snapshot.docs.map(

        (document) => ({

          id: document.id,

          ...document.data()

        })

      );


    /*
      새 질문이 들어와도
      현재 보고 있던 질문 유지
    */

    if (previousId) {

      const foundIndex =
        questions.findIndex(

          q =>
            q.id ===
            previousId

        );


      if (foundIndex !== -1) {

        currentIndex =
          foundIndex;

      }

    }


    if (
      currentIndex >=
      questions.length
    ) {

      currentIndex =
        Math.max(
          0,
          questions.length - 1
        );

    }


    render();

  },

  (error) => {

    console.error(
      "질문 불러오기 오류:",
      error
    );

  }

);


/* ==============================
   관리자에서 변경한 질문 감지
============================== */

const displayRef =
  doc(
    db,
    "display",
    "current"
  );


onSnapshot(

  displayRef,

  (snapshot) => {

    if (!snapshot.exists()) {
      return;
    }


    const data =
      snapshot.data();


    if (
      data.visible === false
    ) {

      visible = false;

      questionBox.style.display =
        "none";

      return;

    }


    if (data.questionId) {

      const foundIndex =
        questions.findIndex(

          q =>
            q.id ===
            data.questionId

        );


      if (foundIndex !== -1) {

        currentIndex =
          foundIndex;

        currentQuestionId =
          data.questionId;

      }

    }


    visible = true;

    render();

  }

);


/* ==============================
   화면 그리기
============================== */

function render() {

  if (
    questions.length === 0
  ) {

    questionBox.style.display =
      "none";

    controlCounter.textContent =
      "0 / 0";

    prevBtn.disabled = true;
    nextBtn.disabled = true;

    return;

  }


  const question =
    questions[currentIndex];


  currentQuestionId =
    question.id;


  questionText.textContent =
    question.text || "";


  counter.textContent =
    (currentIndex + 1) +
    " / " +
    questions.length;


  controlCounter.textContent =
    (currentIndex + 1) +
    " / " +
    questions.length;


  prevBtn.disabled =
    currentIndex === 0;


  nextBtn.disabled =
    currentIndex ===
    questions.length - 1;


  if (visible) {

    questionBox.style.display =
      "block";

  }

}


/* ==============================
   Firebase에 현재 질문 저장
============================== */

async function saveCurrentQuestion() {

  if (
    questions.length === 0
  ) {
    return;
  }


  const question =
    questions[currentIndex];


  currentQuestionId =
    question.id;

  visible = true;


  await setDoc(

    displayRef,

    {

      text:
        question.text || "",

      questionId:
        question.id,

      visible:
        true,

      updatedAt:
        serverTimestamp()

    }

  );


  render();

}


/* ==============================
   다음 질문
============================== */

async function nextQuestion() {

  if (
    currentIndex >=
    questions.length - 1
  ) {
    return;
  }


  currentIndex++;

  await saveCurrentQuestion();

}


/* ==============================
   이전 질문
============================== */

async function prevQuestion() {

  if (
    currentIndex <= 0
  ) {
    return;
  }


  currentIndex--;

  await saveCurrentQuestion();

}


/* ==============================
   질문 숨기기
============================== */

async function hideQuestion() {

  visible = false;

  questionBox.style.display =
    "none";


  await setDoc(

    displayRef,

    {

      text: "",

      questionId:
        currentQuestionId,

      visible:
        false,

      updatedAt:
        serverTimestamp()

    }

  );

}


/* ==============================
   다시 표시
============================== */

async function showQuestion() {

  if (
    questions.length === 0
  ) {
    return;
  }

  visible = true;

  await saveCurrentQuestion();

}


/* ==============================
   버튼
============================== */

prevBtn.onclick =
  prevQuestion;

nextBtn.onclick =
  nextQuestion;

hideBtn.onclick =
  hideQuestion;


/* ==============================
   키보드
============================== */

document.addEventListener(

  "keydown",

  async (event) => {


    /*
      → 다음 질문
    */

    if (
      event.key ===
      "ArrowRight"
    ) {

      event.preventDefault();

      await nextQuestion();

    }


    /*
      ← 이전 질문
    */

    if (
      event.key ===
      "ArrowLeft"
    ) {

      event.preventDefault();

      await prevQuestion();

    }


    /*
      ESC 숨기기
    */

    if (
      event.key ===
      "Escape"
    ) {

      event.preventDefault();

      await hideQuestion();

    }


    /*
      SPACE 다시 표시
    */

    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      await showQuestion();

    }

  }

);

</script>

</body>
</html>
