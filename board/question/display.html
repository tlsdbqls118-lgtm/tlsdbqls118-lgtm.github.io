<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>방송 질문 화면</title>

<style>

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
  Arial,
  "Noto Sans KR",
  sans-serif;

  background: transparent;

}


/* 로그인 화면 */

#loginScreen {

  position: absolute;

  top: 30px;
  left: 50%;

  transform: translateX(-50%);

  background: rgba(30,30,30,0.9);

  padding: 15px 20px;

  border-radius: 12px;

  color: white;

  z-index: 100;

}


#loginBtn {

  border: 0;

  background: #4285f4;

  color: white;

  padding: 10px 18px;

  border-radius: 8px;

  cursor: pointer;

  font-weight: bold;

}


/* 컨트롤 */

#controls {

  display: none;

  position: absolute;

  top: 20px;
  left: 50%;

  transform: translateX(-50%);

  background: rgba(35,35,35,0.85);

  padding: 10px;

  border-radius: 14px;

  z-index: 50;

  white-space: nowrap;

}


#controls button {

  border: 0;

  background: #555;

  color: white;

  padding: 10px 16px;

  border-radius: 7px;

  cursor: pointer;

  font-size: 15px;

  font-weight: bold;

  margin: 0 3px;

}


#counter {

  display: inline-block;

  color: white;

  min-width: 80px;

  text-align: center;

  font-size: 16px;

  font-weight: bold;

}


/* 질문 박스 */

#questionBox {

  display: none;

  position: absolute;

  left: 50%;

  bottom: 60px;

  transform: translateX(-50%);

  width: 80%;

  max-width: 1000px;

  box-sizing: border-box;

  padding: 28px 36px;

  background: rgba(0,0,0,0.82);

  color: white;

  border-radius: 22px;

  text-align: center;

  box-shadow:
  0 8px 30px
  rgba(0,0,0,0.35);

}


#label {

  display: block;

  margin-bottom: 12px;

  font-size: 20px;

  font-weight: 600;

  opacity: 0.7;

}


#questionText {

  font-size: 38px;

  font-weight: 700;

  line-height: 1.45;

  word-break: keep-all;

  overflow-wrap: break-word;

}


/* 상태 */

#message {

  color: white;

  margin-right: 10px;

  font-size: 14px;

}

</style>

</head>


<body>


<div id="loginScreen">

  <span id="loginStatus">
    방송자 로그인이 필요합니다.
  </span>

  <button id="loginBtn">
    Google 로그인
  </button>

</div>


<div id="controls">

  <button id="prevBtn">
    ◀ 이전
  </button>

  <span id="counter">
    0 / 0
  </span>

  <button id="nextBtn">
    다음 ▶
  </button>

  <button id="hideBtn">
    숨기기
  </button>

  <button id="logoutBtn">
    로그아웃
  </button>

</div>


<div id="questionBox">

  <span id="label">
    익명 질문
  </span>

  <div id="questionText"></div>

</div>


<script type="module">


import {

  initializeApp

}

from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {

  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {

  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot

}

from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "여기에_현재_정상작동하는_API_KEY",
  authDomain: "anonymous-question-47aaf.firebaseapp.com",
  projectId: "anonymous-question-47aaf",
  storageBucket: "anonymous-question-47aaf.firebasestorage.app",
  messagingSenderId: "156669665259",
  appId: "1:156669665259:web:188f4f90005abacb22c3ae"
};


const ADMIN_EMAIL =
"ragoondog@gmail.com";


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const loginScreen =
document.getElementById("loginScreen");


const loginStatus =
document.getElementById("loginStatus");


const loginBtn =
document.getElementById("loginBtn");


const logoutBtn =
document.getElementById("logoutBtn");


const controls =
document.getElementById("controls");


const questionBox =
document.getElementById("questionBox");


const questionText =
document.getElementById("questionText");


const counter =
document.getElementById("counter");


const prevBtn =
document.getElementById("prevBtn");


const nextBtn =
document.getElementById("nextBtn");


const hideBtn =
document.getElementById("hideBtn");


let questions = [];

let currentIndex = 0;

let hidden = false;

let unsubscribe = null;


/* 로그인 */

loginBtn.onclick = async () => {

  try {

    const provider =
    new GoogleAuthProvider();


    provider.setCustomParameters({

      prompt:
      "select_account"

    });


    await signInWithPopup(
      auth,
      provider
    );


  } catch(error) {

    console.error(error);

    alert(
      "로그인 오류: " +
      error.message
    );

  }

};


/* 로그아웃 */

logoutBtn.onclick =
async () => {

  await signOut(auth);

};


/* 로그인 상태 */

onAuthStateChanged(
auth,
(user) => {

  if (!user) {

    loginScreen.style.display =
    "block";

    controls.style.display =
    "none";

    questionBox.style.display =
    "none";

    questions = [];

    currentIndex = 0;

    if (unsubscribe) {

      unsubscribe();

      unsubscribe = null;

    }

    return;

  }


  if (user.email !== ADMIN_EMAIL) {

    alert(
      "방송 관리자 계정이 아닙니다."
    );

    signOut(auth);

    return;

  }


  loginScreen.style.display =
  "none";


  controls.style.display =
  "block";


  loadQuestions();

});


/* 질문 불러오기 */

function loadQuestions() {


  if (unsubscribe) {

    unsubscribe();

  }


  const q = query(

    collection(
      db,
      "questions"
    ),

    orderBy(
      "createdAt",
      "asc"
    )

  );


  unsubscribe =
  onSnapshot(

    q,

    (snapshot) => {


      questions = [];


      snapshot.forEach(
      (questionDoc) => {

        const data =
        questionDoc.data();


        if (
          data.text &&
          data.text.trim()
        ) {

          questions.push({

            id:
            questionDoc.id,

            text:
            data.text

          });

        }

      });


      if (
        currentIndex >=
        questions.length
      ) {

        currentIndex =
        Math.max(
          0,
          questions.length - 1
        );

      }


      renderQuestion();

    },


    (error) => {

      console.error(
        "질문 불러오기 오류:",
        error
      );


      alert(
        "질문 불러오기 오류: " +
        error.message
      );

    }

  );

}


/* 화면 표시 */

function renderQuestion() {


  if (
    questions.length === 0
  ) {

    counter.textContent =
    "0 / 0";

    questionBox.style.display =
    "none";

    return;

  }


  counter.textContent =
  (currentIndex + 1) +
  " / " +
  questions.length;


  questionText.textContent =
  questions[currentIndex].text;


  if (hidden) {

    questionBox.style.display =
    "none";

    hideBtn.textContent =
    "보이기";

  } else {

    questionBox.style.display =
    "block";

    hideBtn.textContent =
    "숨기기";

  }


  prevBtn.disabled =
  currentIndex === 0;


  nextBtn.disabled =
  currentIndex ===
  questions.length - 1;

}


/* 이전 */

prevBtn.onclick = () => {

  if (
    currentIndex > 0
  ) {

    currentIndex--;

    hidden = false;

    renderQuestion();

  }

};


/* 다음 */

nextBtn.onclick = () => {

  if (
    currentIndex <
    questions.length - 1
  ) {

    currentIndex++;

    hidden = false;

    renderQuestion();

  }

};


/* 숨기기 */

hideBtn.onclick = () => {

  hidden = !hidden;

  renderQuestion();

};


/* 키보드 조작 */

document.addEventListener(
"keydown",
(event) => {


  if (
    event.key ===
    "ArrowRight"
  ) {

    nextBtn.click();

  }


  if (
    event.key ===
    "ArrowLeft"
  ) {

    prevBtn.click();

  }


  if (
    event.key === " " ||
    event.code === "Space"
  ) {

    event.preventDefault();

    hideBtn.click();

  }

});


</script>

</body>

</html>
