<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방송 질문</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      text-align: center;
    }

    #questionBox {
      background: rgba(0,0,0,0.88);
      color: white;
      border-radius: 25px;
      padding: 45px 50px;
      min-height: 260px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }

    #label {
      font-size: 20px;
      opacity: 0.65;
      margin-bottom: 15px;
    }

    #questionText {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.5;

      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    #counter {
      margin-top: 25px;
      font-size: 18px;
      opacity: 0.6;
    }

    #controls {
      margin-top: 25px;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 30px;

      background: #222;
      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #controlCounter {
      min-width: 100px;
      font-size: 20px;
      font-weight: bold;
    }

    #empty {
      display: none;

      background: white;
      border-radius: 20px;
      padding: 50px;

      font-size: 24px;
      font-weight: bold;
    }

    .help {
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }

  </style>
</head>


<body>

<div class="container">

  <div id="questionBox">

    <div id="label">
      익명 질문
    </div>

    <div id="questionText">
      질문 불러오는 중...
    </div>

    <div id="counter"></div>

  </div>


  <div id="empty">
    아직 질문이 없습니다.
  </div>


  <div id="controls">

    <button id="prevBtn">
      ◀ 이전
    </button>

    <div id="controlCounter">
      0 / 0
    </div>

    <button id="nextBtn">
      다음 ▶
    </button>

  </div>


  <div class="help">
    키보드 ← → 방향키로도 질문을 넘길 수 있습니다.
  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDq1lPYv5OWP0rdsJCbMh3Xt_laZKEptVQ",

  authDomain:
    "anonymous-question-47aaf.firebaseapp.com",

  projectId:
    "anonymous-question-47aaf",

  storageBucket:
    "anonymous-question-47aaf.firebasestorage.app",

  messagingSenderId:
    "156669665259",

  appId:
    "1:156669665259:web:188f4f90005abacb22c3ae"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


const questionBox =
  document.getElementById("questionBox");

const questionText =
  document.getElementById("questionText");

const counter =
  document.getElementById("counter");

const controlCounter =
  document.getElementById("controlCounter");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const empty =
  document.getElementById("empty");


let questions = [];

let currentIndex = 0;

let currentQuestionId = null;


/* ==========================
   Firebase 질문 실시간 수신
========================== */

const questionsQuery =
  query(

    collection(
      db,
      "questions"
    ),

    orderBy(
      "createdAt",
      "asc"
    )

  );


onSnapshot(

  questionsQuery,

  (snapshot) => {

    /*
      새 질문이 들어와도
      현재 보고 있는 질문 유지
    */

    const oldId =
      currentQuestionId;


    questions =
      snapshot.docs.map(

        document => ({

          id:
            document.id,

          ...document.data()

        })

      );


    if (oldId) {

      const found =
        questions.findIndex(

          question =>
            question.id === oldId

        );


      if (found !== -1) {

        currentIndex =
          found;

      }

    }


    if (
      currentIndex >=
      questions.length
    ) {

      currentIndex =
        Math.max(
          0,
          questions.length - 1
        );

    }


    render();

  },

  (error) => {

    console.error(error);

    questionText.textContent =
      "질문을 불러올 수 없습니다.";

  }

);


/* ==========================
   질문 표시
========================== */

function render() {

  if (
    questions.length === 0
  ) {

    questionBox.style.display =
      "none";

    empty.style.display =
      "block";

    controls.style.display =
      "none";

    return;

  }


  questionBox.style.display =
    "flex";

  empty.style.display =
    "none";

  controls.style.display =
    "flex";


  const question =
    questions[currentIndex];


  currentQuestionId =
    question.id;


  questionText.textContent =
    question.text ||
    "(내용 없음)";


  const numberText =
    (currentIndex + 1) +
    " / " +
    questions.length;


  counter.textContent =
    numberText;


  controlCounter.textContent =
    numberText;


  prevBtn.disabled =
    currentIndex === 0;


  nextBtn.disabled =
    currentIndex ===
    questions.length - 1;

}


/* ==========================
   이전 질문
========================== */

function previousQuestion() {

  if (
    currentIndex <= 0
  ) {
    return;
  }


  currentIndex--;

  render();

}


/* ==========================
   다음 질문
========================== */

function nextQuestion() {

  if (
    currentIndex >=
    questions.length - 1
  ) {
    return;
  }


  currentIndex++;

  render();

}


/* ==========================
   버튼
========================== */

prevBtn.onclick =
  previousQuestion;

nextBtn.onclick =
  nextQuestion;


/* ==========================
   키보드
========================== */

document.addEventListener(

  "keydown",

  (event) => {


    if (
      event.key ===
      "ArrowRight"
    ) {

      event.preventDefault();

      nextQuestion();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      event.preventDefault();

      previousQuestion();

    }

  }

);

</script>

</body>
</html>
