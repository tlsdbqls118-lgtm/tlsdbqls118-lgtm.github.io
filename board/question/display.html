<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>방송 질문 화면</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  background: #f5f5f5;
}


/* 전체 */

.container {
  width: 100%;
  min-height: 100vh;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 30px;
}


/* 질문 박스 */

#questionBox {

  width: 85%;
  max-width: 1100px;

  min-height: 260px;

  background:
    rgba(0, 0, 0, 0.88);

  color: white;

  border-radius: 24px;

  padding: 40px 50px;

  display: flex;

  flex-direction: column;

  justify-content: center;
  align-items: center;

  text-align: center;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,0.25);

}


#label {

  font-size: 20px;

  font-weight: 600;

  opacity: 0.65;

  margin-bottom: 18px;

}


#questionText {

  font-size: 38px;

  font-weight: 700;

  line-height: 1.5;

  word-break: keep-all;

  overflow-wrap: break-word;

  white-space: pre-wrap;

}


/* 조작 영역 */

#controls {

  margin-top: 25px;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 12px;

}


button {

  border: 0;

  border-radius: 10px;

  padding: 14px 24px;

  cursor: pointer;

  font-size: 17px;

  font-weight: bold;

  background: #222;

  color: white;

}


button:hover {

  background: #444;

}


button:disabled {

  opacity: 0.3;

  cursor: not-allowed;

}


#hideBtn {

  background: #666;

}


#counter {

  min-width: 100px;

  text-align: center;

  font-size: 20px;

  font-weight: bold;

}


/* 도움말 */

#help {

  margin-top: 18px;

  font-size: 14px;

  color: #777;

}


/* 질문 없음 */

#empty {

  display: none;

  font-size: 25px;

  font-weight: bold;

  padding: 50px;

}


/* 오류 */

#errorMessage {

  display: none;

  margin-top: 20px;

  color: #c0392b;

  font-weight: bold;

}

</style>

</head>


<body>


<div class="container">


  <div id="questionBox">

    <div id="label">
      익명 질문
    </div>

    <div id="questionText">
      질문을 불러오는 중...
    </div>

  </div>


  <div id="empty">
    아직 질문이 없습니다.
  </div>


  <div id="controls">

    <button id="prevBtn">
      ◀ 이전
    </button>


    <div id="counter">
      0 / 0
    </div>


    <button id="nextBtn">
      다음 ▶
    </button>


    <button id="hideBtn">
      숨기기
    </button>

  </div>


  <div id="help">

    ← 이전 질문 /
    → 다음 질문 /
    Space 숨기기·보이기

  </div>


  <div id="errorMessage"></div>


</div>


<script type="module">


import {

  initializeApp

}

from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {

  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot

}

from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



/* =========================
   Firebase 설정
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCbWRpIzYpR_9djEoyJJjUX0-z8RjDQMFw",

  authDomain:
    "anonymous-question-47aaf.firebaseapp.com",

  projectId:
    "anonymous-question-47aaf",

  storageBucket:
    "anonymous-question-47aaf.firebasestorage.app",

  messagingSenderId:
    "156669665259",

  appId:
    "1:156669665259:web:188f4f90005abacb22c3ae"

};



/* =========================
   Firebase 시작
========================= */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);



/* =========================
   HTML 요소
========================= */

const questionBox =
  document.getElementById(
    "questionBox"
  );

const questionText =
  document.getElementById(
    "questionText"
  );

const controls =
  document.getElementById(
    "controls"
  );

const counter =
  document.getElementById(
    "counter"
  );

const prevBtn =
  document.getElementById(
    "prevBtn"
  );

const nextBtn =
  document.getElementById(
    "nextBtn"
  );

const hideBtn =
  document.getElementById(
    "hideBtn"
  );

const empty =
  document.getElementById(
    "empty"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );



/* =========================
   상태
========================= */

let questions = [];

let currentIndex = 0;

let currentQuestionId = null;

let hidden = false;



/* =========================
   질문 실시간 불러오기
========================= */

const questionsQuery =
  query(

    collection(
      db,
      "questions"
    ),

    orderBy(
      "createdAt",
      "asc"
    )

  );


onSnapshot(

  questionsQuery,

  (snapshot) => {


    /*
      새 질문이 들어왔을 때
      현재 보고 있던 질문 유지
    */

    const oldQuestionId =
      currentQuestionId;


    questions =
      snapshot.docs
        .map((document) => {

          const data =
            document.data();

          return {

            id:
              document.id,

            text:
              data.text || ""

          };

        })

        .filter((question) =>

          question.text.trim() !== ""

        );


    /*
      현재 질문 위치 유지
    */

    if (oldQuestionId) {

      const foundIndex =
        questions.findIndex(

          question =>
            question.id ===
            oldQuestionId

        );


      if (foundIndex !== -1) {

        currentIndex =
          foundIndex;

      }

    }


    /*
      삭제 등으로 번호가
      범위를 벗어난 경우
    */

    if (
      currentIndex >=
      questions.length
    ) {

      currentIndex =
        Math.max(
          0,
          questions.length - 1
        );

    }


    renderQuestion();

  },


  (error) => {

    console.error(error);

    errorMessage.style.display =
      "block";

    errorMessage.textContent =
      "질문 불러오기 오류: " +
      error.message;

  }

);



/* =========================
   화면 표시
========================= */

function renderQuestion() {


  if (
    questions.length === 0
  ) {

    questionBox.style.display =
      "none";

    empty.style.display =
      "block";

    counter.textContent =
      "0 / 0";

    prevBtn.disabled =
      true;

    nextBtn.disabled =
      true;

    hideBtn.disabled =
      true;

    return;

  }


  empty.style.display =
    "none";


  hideBtn.disabled =
    false;


  const question =
    questions[currentIndex];


  currentQuestionId =
    question.id;


  questionText.textContent =
    question.text;


  counter.textContent =
    (currentIndex + 1) +
    " / " +
    questions.length;


  prevBtn.disabled =
    currentIndex === 0;


  nextBtn.disabled =
    currentIndex ===
    questions.length - 1;


  if (hidden) {

    questionBox.style.display =
      "none";

    hideBtn.textContent =
      "보이기";

  }

  else {

    questionBox.style.display =
      "flex";

    hideBtn.textContent =
      "숨기기";

  }

}



/* =========================
   이전 질문
========================= */

function previousQuestion() {


  if (
    currentIndex <= 0
  ) {
    return;
  }


  currentIndex--;

  hidden = false;

  renderQuestion();

}



/* =========================
   다음 질문
========================= */

function nextQuestion() {


  if (
    currentIndex >=
    questions.length - 1
  ) {
    return;
  }


  currentIndex++;

  hidden = false;

  renderQuestion();

}



/* =========================
   숨기기 / 보이기
========================= */

function toggleQuestion() {

  if (
    questions.length === 0
  ) {
    return;
  }


  hidden =
    !hidden;


  renderQuestion();

}



/* =========================
   버튼 연결
========================= */

prevBtn.onclick =
  previousQuestion;


nextBtn.onclick =
  nextQuestion;


hideBtn.onclick =
  toggleQuestion;



/* =========================
   키보드
========================= */

document.addEventListener(

  "keydown",

  (event) => {


    if (
      event.key ===
      "ArrowLeft"
    ) {

      event.preventDefault();

      previousQuestion();

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      event.preventDefault();

      nextQuestion();

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      toggleQuestion();

    }

  }

);


</script>


</body>

</html>
