<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>질문 관리자</title>

  <style>
    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    #loginBtn {
      background: #4285f4;
      color: white;
      font-size: 16px;
    }

    #logoutBtn {
      background: #555;
      color: white;
      margin-left: 8px;
    }

    .question {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .questionText {
      font-size: 18px;
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .deleteBtn {
      background: #e74c3c;
      color: white;
    }

    #adminArea {
      display: none;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #count {
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>질문 관리자</h1>

  <div class="box" id="loginArea">
    <button id="loginBtn">Google 로그인</button>
    <div id="status">관리자 로그인이 필요합니다.</div>
  </div>

  <div id="adminArea">

    <div class="box">
      <strong id="userInfo"></strong>
      <button id="logoutBtn">로그아웃</button>
    </div>

    <h2>받은 질문</h2>

    <div id="count"></div>

    <div id="questionList">
      질문을 불러오는 중...
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "여기에_현재_정상작동하는_API_KEY",
  authDomain: "anonymous-question-47aaf.firebaseapp.com",
  projectId: "anonymous-question-47aaf",
  storageBucket: "anonymous-question-47aaf.firebasestorage.app",
  messagingSenderId: "156669665259",
  appId: "1:156669665259:web:188f4f90005abacb22c3ae"
};

const ADMIN_EMAIL = "ragoondog@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginArea = document.getElementById("loginArea");
const adminArea = document.getElementById("adminArea");
const status = document.getElementById("status");
const userInfo = document.getElementById("userInfo");
const questionList = document.getElementById("questionList");
const count = document.getElementById("count");


loginBtn.onclick = async () => {

  try {

    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });

    await signInWithPopup(auth, provider);

  } catch (error) {

    console.error(error);
    alert("로그인 오류: " + error.message);

  }

};


logoutBtn.onclick = async () => {
  await signOut(auth);
};


onAuthStateChanged(auth, (user) => {

  if (!user) {

    loginArea.style.display = "block";
    adminArea.style.display = "none";
    status.textContent = "관리자 로그인이 필요합니다.";

    return;
  }

  if (user.email !== ADMIN_EMAIL) {

    alert("관리자 계정이 아닙니다.");
    signOut(auth);

    return;
  }

  loginArea.style.display = "none";
  adminArea.style.display = "block";

  userInfo.textContent =
    "관리자 로그인: " + user.email;

  loadQuestions();

});


function loadQuestions() {

  const q = query(
    collection(db, "questions"),
    orderBy("createdAt", "asc")
  );

  onSnapshot(q, (snapshot) => {

    questionList.innerHTML = "";

    count.textContent =
      "총 질문: " + snapshot.size + "개";

    if (snapshot.empty) {

      questionList.innerHTML =
        "<div class='box'>아직 질문이 없습니다.</div>";

      return;
    }

    let number = 1;

    snapshot.forEach((questionDoc) => {

      const data = questionDoc.data();

      const div = document.createElement("div");
      div.className = "question";

      const text = document.createElement("div");
      text.className = "questionText";

      text.textContent =
        number + ". " + (data.text || "");

      const deleteBtn =
        document.createElement("button");

      deleteBtn.className = "deleteBtn";
      deleteBtn.textContent = "삭제";

      deleteBtn.onclick = async () => {

        if (!confirm("이 질문을 삭제할까요?")) {
          return;
        }

        try {

          await deleteDoc(
            doc(db, "questions", questionDoc.id)
          );

        } catch (error) {

          console.error(error);
          alert("삭제 오류: " + error.message);

        }

      };

      div.appendChild(text);
      div.appendChild(deleteBtn);

      questionList.appendChild(div);

      number++;

    });

  }, (error) => {

    console.error(error);

    questionList.innerHTML =
      "<div class='box'>질문 불러오기 오류: " +
      error.message +
      "</div>";

  });

}

</script>

</body>
</html>
